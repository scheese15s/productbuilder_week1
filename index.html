<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>신나는 덧셈 놀이! | 아이들을 위한 재미있는 숫자 공부</title>
    <meta name="description" content="아이들이 좋아하는 숫자 블록과 함께 즐겁게 덧셈을 배워요! 정답을 맞추면 신나는 축하가! 놀면서 배우는 유아, 초등학생용 산수 게임.">
    <meta name="keywords" content="덧셈, 덧셈 공부, 산수, 숫자 놀이, 숫자 공부, 유아 수학, 초등 수학, 교육용 게임, 어린이 게임, 셈하기">

    <!-- Cache Busting: Add version query string -->
    <link rel="stylesheet" href="style.css?v=3.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <h1>신나는 덧셈 놀이!</h1>
        <div id="problem">
            <div id="num1-container"></div>
            <span class="operator">+</span>
            <div id="num2-container"></div>
            <span class="operator">=</span>
            <span class="answer-box">?</span>
        </div>
        <div id="input-area">
            <input type="number" id="answer" placeholder="정답은?">
            <button id="check-answer">확인</button>
        </div>

        <div id="feedback"></div>
    </div>

    <!-- Hogi Popup -->
    <div id="hogi-popup" class="hidden">
        <img src="hogi.jpg" alt="귀여운 캐릭터 호기">
    </div>

    <!-- Cache Busting: Add version query string -->
    <script src="main.js?v=3.0"></script>
</body>
</html>
