<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>신나는 수학 놀이! | 덧셈과 곱셈 4지선다 게임</title>
    <meta name="description" content="아이들이 좋아하는 숫자 블록과 함께 덧셈, 곱셈을 즐겁게 배워요! 정답을 맞추면 신나는 축하가! 놀면서 배우는 유아, 초등학생용 산수 게임.">
    <meta name="keywords" content="덧셈, 곱셈, 산수, 숫자 놀이, 숫자 공부, 유아 수학, 초등 수학, 교육용 게임, 어린이 게임, 셈하기">

    <link rel="stylesheet" href="style.css?v=5.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <h1>신나는 수학 놀이!</h1>

        <div id="mode-picker" aria-label="문제 유형 선택">
            <button id="mode-menu-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
                문제: 덧셈
            </button>
            <ul id="mode-menu-list" class="hidden" role="listbox" aria-label="문제 유형 목록"></ul>
        </div>

        <div id="problem">
            <div id="num1-container"></div>
            <span class="operator" id="operator-symbol">+</span>
            <div id="num2-container"></div>
            <span class="operator">=</span>
            <span class="answer-box">?</span>
        </div>

        <div id="choices-area" aria-label="정답 선택지"></div>
        <div id="feedback"></div>
    </div>

    <section id="contact-section" aria-label="문의하기">
        <h2>문의하기</h2>
        <form id="contact-form" action="https://formspree.io/f/xkovrkey" method="POST">
            <label for="contact-email">이메일</label>
            <input id="contact-email" name="email" type="email" placeholder="you@example.com" required>

            <label for="contact-message">메시지</label>
            <textarea id="contact-message" name="message" rows="4" placeholder="문의 내용을 적어주세요." required></textarea>

            <input type="hidden" name="_subject" value="신나는 수학 놀이 문의">
            <button type="submit">보내기</button>
        </form>
    </section>

    <!-- Hogi Popup -->
    <div id="hogi-popup" class="hidden">
        <img src="hogi.jpg" alt="귀여운 캐릭터 호기">


    </div>

    <script src="main.js?v=5.0"></script>
</body>
</html>
